[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asc-cli"
version = "0.1.0"
description = "AI Secure Coding command-line tool"
requires-python = ">=3.8"

[project.scripts]
asc = "asc.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asc*"]
